<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .login-container{
      background:white;
      padding:40px;
      width:350px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      text-align:center;
    }

    .login-container h2{
      margin-bottom:25px;
      color:#333;
    }

    .input-box{
      margin-bottom:20px;
      text-align:left;
    }

    .input-box label{
      display:block;
      margin-bottom:8px;
      color:#555;
      font-size:14px;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#4facfe;
      outline:none;
      box-shadow:0 0 5px rgba(79,172,254,0.5);
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4facfe;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#00c6fb;
    }

    .extra-links{
      margin-top:15px;
      font-size:14px;
    }

    .extra-links a{
      color:#4facfe;
      text-decoration:none;
    }

    .extra-links a:hover{
      text-decoration:underline;
    }
    .bottom-link{
  position: absolute;
  bottom: 20px;
  text-align: center;
  width: 100%;
}

.bottom-link a{
  color: white;
  font-size: 16px;
  text-decoration: none;
}

.bottom-link a:hover{
  text-decoration: underline;
}
  </style>
</head>

<body>
   

  <div class="login-container">
    <h2>Login</h2>

    <form>
      <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div class="extra-links">
        <p><a href="#">Forgot Password?</a></p>
        <p>Don't have an account? <a href="#">Sign Up</a></p>
      </div>
    </form>
  </div>
  <div class="bottom-link">
  <a href="https://www.linkedin.com/in/samradh-joshi-084a1929a/">Samradh's Linkedin</a>
</div>

</body>
</html>
